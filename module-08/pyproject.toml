[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-enterprise-integration"
version = "0.1.0"
description = "Production-grade MCP enterprise AI integration system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk==2.10.0",
    "mcp>=2.3.0",
    "openai-agents>=0.23.1",
    "pydantic>=2.12,<3",
    "streamlit>=1.57,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_enterprise_integration"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dm-aiep-multimodal-voice-platform"
version = "0.1.0"
description = "Module 9 multimodal and voice AI platform (Stories 9.1-9.7: contracts, deterministic foundation, local document and vision understanding, audio and speech pipeline, cross-modal reasoning workflow, voice-assistant orchestration, real-time WebSocket streaming; Story 9.8 opt-in live OpenAI adapters)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.31,<4",
    "pillow>=12.3,<13",
    "pydantic>=2.12,<3",
    "pypdf>=6.19,<7",
    "starlette>=1.8,<2",
    "uvicorn>=0.54,<0.55",
    "websockets>=17.2,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_voice_platform"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

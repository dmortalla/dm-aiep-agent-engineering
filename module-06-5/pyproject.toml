[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dm-aiep-harness-engineering"
version = "0.1.0"
description = "Production-grade harness engineering runtime for governed AI agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2.12,<3",
    # Supported provider SDKs are runtime dependencies: secure opt-in BYOK live mode is an
    # intentional production capability of the deployed app, and a plain `uv sync` (the
    # hosted install path) must provide them without selecting an optional extra.
    "openai>=2.54,<3",
    "anthropic>=1.13,<2",
    # The MCP SDK is a runtime dependency: reviewer demonstrations 7 (MCP boundary) and 8
    # (evaluation and regression) import it, and the hosted app exposes both.
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
orchestration = [
    "langgraph-checkpoint-sqlite>=3,<4",
]
memory = [
    "mem0ai>=2.2,<3",
]
observability = [
    "langsmith>=0.14,<1",
    "langfuse>=4.17,<5",
]
guardrails = [
    "guardrails-ai>=0.11,<1",
]
ui = [
    "streamlit>=1.50,<2",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
